---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - syncthing_storage_path is defined
      - syncthing_storage_path | length > 0
    fail_msg: "'syncthing_storage_path' must be provided at runtime."

- name: Ensure storage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    setype: container_file_t
  become: false
  loop:
    - "{{ syncthing_storage_path }}"
    - "{{ syncthing_storage_path }}/data"

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ syncthing_config_dir | default(ansible_user_dir ~ '/.config/containers/syncthing') }}"
    state: directory
    mode: '0755'
  become: false

- name: Create podman-compose.yml
  ansible.builtin.template:
    src: podman-compose.yml.j2
    dest: "{{ syncthing_config_dir | default(ansible_user_dir ~ '/.config/containers/syncthing') }}/podman-compose.yml"
    mode: '0644'
  become: false

- name: Deploy Syncthing container
  containers.podman.podman_container:
    name: syncthing
    image: syncthing/syncthing:latest
    hostname: syncthing
    state: started
    restart_policy: always
    env:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "{{ syncthing_storage_path }}/data:/var/syncthing:Z"
    ports:
      - "{{ syncthing_web_port | default(8384) }}:8384"
      - "{{ syncthing_listen_port | default(22000) }}:22000"
      - "{{ syncthing_listen_port | default(22000) }}:22000/udp"
    recreate: auto
  become: false
